<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cowork cheat sheet</title>
<!--
  EPLUS brand, default-fonts edition: Arial; Primary Blue #666f89 for headings
  and emphasis, Dark Grey #58595b for text, Light Grey #a6a6a5 for borders,
  Accent Green #3c7d7f only in the header rule. One self-contained file, no
  browser storage, no external scripts (Cowork artifact limits).

  Card template: copy one <article> per demo, just above the CARDS marker.

  <article class="card">
    <h2>TITLE</h2>
    <p>WHAT</p>
    <p class="try"><span>Try saying</span> "PROMPT"</p>
  </article>
-->
<style>
  :root {
    --blue: #666f89; --grey: #58595b; --light: #a6a6a5; --green: #3c7d7f;
    --bg: #ffffff; --panel: #f4f5f8; --text: var(--grey); --head: var(--blue);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e2026; --panel: #2a2d35; --text: #d9dade; --head: #b9bfd1; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Arial, Helvetica, "Liberation Sans", sans-serif; line-height: 1.45;
  }
  header { padding: 28px 24px 18px; border-bottom: 4px solid var(--green); }
  .brand { font-weight: bold; letter-spacing: 0.12em; font-size: 13px; color: var(--head); }
  h1 { margin: 10px 0 4px; font-size: 26px; color: var(--head); }
  .sub { margin: 0; font-size: 14px; }
  main {
    padding: 22px 24px 32px; display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--light); border-radius: 8px;
    padding: 16px 16px 14px;
  }
  .card h2 { margin: 0 0 6px; font-size: 16px; color: var(--head); }
  .card p { margin: 0 0 10px; font-size: 14px; }
  .try { font-style: italic; }
  .try span {
    display: block; font-style: normal; font-weight: bold; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--head); margin-bottom: 2px;
  }
  footer { padding: 0 24px 28px; font-size: 13px; }
</style>
</head>
<body>
  <header>
    <div class="brand">ENGINEERING PLUS</div>
    <h1>{{FIRST_NAME}}'s Cowork cheat sheet</h1>
    <p class="sub">What we tried together on {{DATE}}, and how to ask for it again.</p>
  </header>
  <main>
    <!-- CARDS -->
  </main>
  <footer>Whenever you want to see what else Claude can do, just ask: "Show me what you can do."</footer>
</body>
</html>
